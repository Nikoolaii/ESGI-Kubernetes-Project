apiVersion: v1
kind: Service
metadata:
  name: front
  namespace: tp-microservices
spec:
  type: ClusterIP
  selector:
    app: front
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: kong-proxy
  namespace: tp-microservices
spec:
  type: ClusterIP
  selector:
    app: kong
  ports:
    - name: proxy
      port: 80
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: kong-admin
  namespace: tp-microservices
spec:
  type: ClusterIP
  selector:
    app: kong
  ports:
    - name: admin
      port: 8001
      targetPort: 8001
---
apiVersion: v1
kind: Service
metadata:
  name: back-client
  namespace: tp-microservices
spec:
  type: ClusterIP
  selector:
    app: back-client
  ports:
    - name: http
      port: 3001
      targetPort: 3001
---
apiVersion: v1
kind: Service
metadata:
  name: back-admin
  namespace: tp-microservices
spec:
  type: ClusterIP
  selector:
    app: back-admin
  ports:
    - name: http
      port: 3002
      targetPort: 3002
---
apiVersion: v1
kind: Service
metadata:
  name: s3
  namespace: tp-microservices
spec:
  type: ClusterIP
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: tp-microservices
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: tp-microservices
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
