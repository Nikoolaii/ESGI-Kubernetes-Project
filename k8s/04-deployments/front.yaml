apiVersion: apps/v1
kind: Deployment
metadata:
  name: front
  namespace: tp-microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: front
  template:
    metadata:
      labels:
        app: front
        zone: frontend
    spec:
      containers:
        - name: front
          image: tp/front:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: nginx-conf
          configMap:
            name: front-nginx-config
