apiVersion: apps/v1
kind: Deployment
metadata:
  name: back-client
  namespace: tp-microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: back-client
  template:
    metadata:
      labels:
        app: back-client
        zone: logic
    spec:
      containers:
        - name: back-client
          image: tp/back-client:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: shared-config
          env:
            - name: PORT
              value: "3001"
            - name: SERVICE_NAME
              value: back-client
            - name: APP_CONFIG_FILE
              value: /app/config/app-config.json
          volumeMounts:
            - name: app-file-config
              mountPath: /app/config/app-config.json
              subPath: app-config.json
      volumes:
        - name: app-file-config
          configMap:
            name: back-client-file-config
