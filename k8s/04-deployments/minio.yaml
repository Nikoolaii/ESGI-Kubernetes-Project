apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: tp-microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
        zone: data
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          args:
            - server
            - /data
            - --console-address
            - :9001
          ports:
            - containerPort: 9000
            - containerPort: 9001
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                configMapKeyRef:
                  name: shared-config
                  key: S3_ACCESS_KEY
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: shared-config
                  key: S3_SECRET_KEY
          volumeMounts:
            - name: s3-data
              mountPath: /data
      volumes:
        - name: s3-data
          persistentVolumeClaim:
            claimName: s3-data-pvc
